name: keepalive

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date -u > .keepalive
      - run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%F)" || true
          git push || true
